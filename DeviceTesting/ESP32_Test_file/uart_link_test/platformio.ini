; UART link test: ESP32-S3 (N16R8) <-> STM32 Nucleo-F411RE USART1.
; Replies "PONG <n>" to every "PING <n>" line from the STM32.

[env:esp32s3]
; Pinned: the latest platform's toolchain-xtensa-esp-elf 14.2.0 extracts
; incompletely on this Windows PC (missing stdint.h / C++ headers).
; 6.9.0 = Arduino core 2.0.x with the older, working toolchain-xtensa-esp32s3.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16 MB QIO flash + 8 MB octal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; ESP32-S3 CH343 USB-UART port on this PC (COM3 is the Nucleo ST-LINK).
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
monitor_filters = time
