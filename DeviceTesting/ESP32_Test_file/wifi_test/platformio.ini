; Wi-Fi + HTTPS/TLS reachability test for ESP32-S3 (N16R8).
; W1: join Wi-Fi, report IP/RSSI, auto-reconnect after AP loss.
; W2: NTP time sync, DNS, verified TLS to the Firebase RTDB host, read-only GET.

[env:esp32s3]
; Pinned: see uart_link_test/platformio.ini (latest toolchain extracts incompletely here).
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16 MB QIO flash + 8 MB octal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; ESP32-S3 CH343 USB-UART port on this PC (COM3 is the Nucleo ST-LINK).
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
monitor_filters = time
